<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Core Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#08070d;color:white}header{background:#0d0b14;border-bottom:1px solid #292333;padding:20px 7%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:bold}.logo span{color:#9b5cff}button{cursor:pointer}.logout{background:#9b5cff;color:white;border:none;padding:11px 20px;border-radius:8px;font-weight:bold}main{padding:45px 7%}h1{font-size:42px;margin-bottom:10px}.subtitle{color:#aaa4b5;margin-bottom:35px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#100d17;border:1px solid #292333;border-radius:15px;padding:30px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#9b5cff}.card h2{color:#9b5cff;margin-bottom:10px}.card p{color:#aaa4b5}.panel{display:none;margin-top:30px;background:#100d17;border:1px solid #292333;border-radius:15px;padding:30px}.panel.active{display:block}.panel h2{margin-bottom:20px}input,select{width:100%;padding:12px;margin-bottom:12px;background:#08070d;color:white;border:1px solid #332c3c;border-radius:7px}.action,.approve,.reject,.delete{color:white;border:none;padding:9px 14px;border-radius:7px;font-weight:bold}.action,.approve{background:#9b5cff}.reject,.delete{background:#c0392b}.back{background:transparent;color:white;border:1px solid #41394d;padding:11px 18px;border-radius:8px;margin-left:8px}.item{background:#08070d;border:1px solid #292333;border-radius:10px;padding:18px;margin-top:12px}.item h3{margin-bottom:8px}.item p{color:#aaa4b5;line-height:1.7}.item-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.approve:disabled,.reject:disabled{opacity:.5;cursor:not-allowed}.status-badge{display:inline-block;padding:5px 9px;border-radius:6px;font-size:12px;font-weight:bold;margin-top:10px;background:#292333}.status-pending{color:#ffd166}.status-approved{color:#6cff9b}.status-rejected{color:#ff7777}.empty{color:#aaa4b5;margin-top:15px}.small{font-size:12px;color:#77717f}@media(max-width:800px){.cards{grid-template-columns:1fr}main{padding:30px 5%}}
</style>
</head>
<body>
<header><div class="logo">AURA <span>CORE</span> ADMIN</div><button class="logout" id="logout">LOGOUT</button></header>
<main>
<h1>Admin Dashboard 👑</h1><p class="subtitle">Manage Aura Core Esports.</p>
<div class="cards">
<div class="card" id="tournamentCard"><h2>🏆 Tournaments</h2><p>Create and manage tournaments.</p></div>
<div class="card" id="playersCard"><h2>👥 Players</h2><p>View registered players.</p></div>
<div class="card" id="registrationCard"><h2>📋 Registrations</h2><p>View and approve tournament registrations.</p></div>
</div>
<div class="panel" id="tournamentPanel"><h2>🏆 Tournament Management</h2><input id="tournamentName" placeholder="Tournament name"><select id="tournamentGame"><option>Free Fire</option><option>BGMI</option><option>Valorant</option></select><input id="tournamentDate" type="date"><input id="entryFee" type="number" placeholder="Entry fee"><input id="prizePool" type="number" placeholder="Prize pool"><button class="action" id="createTournament">CREATE TOURNAMENT</button><button class="back" onclick="closePanels()">BACK</button><div id="tournamentList"></div></div>
<div class="panel" id="playersPanel"><h2>👥 Players</h2><div id="playersList"></div><button class="back" onclick="closePanels()">BACK</button></div>
<div class="panel" id="registrationPanel"><h2>📋 Registrations</h2><div id="registrationList"></div><button class="back" onclick="closePanels()">BACK</button></div>
</main>
<script>
const SUPABASE_URL="https://lhwwplkxegkedlcgdxil.supabase.co";
const SUPABASE_KEY="sb_publishable_aQlhnCTO4O1iRDqdoqWBzQ_-75xuvVc";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const tournamentPanel=document.getElementById("tournamentPanel"),playersPanel=document.getElementById("playersPanel"),registrationPanel=document.getElementById("registrationPanel");
function escapeHTML(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function formatIndiaTime(value){if(!value)return"N/A";const d=new Date(value);if(Number.isNaN(d.getTime()))return escapeHTML(value);return d.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true})+" IST"}
function closePanels(){tournamentPanel.classList.remove("active");playersPanel.classList.remove("active");registrationPanel.classList.remove("active")}
function showPanel(panel){closePanels();panel.classList.add("active")}
document.getElementById("tournamentCard").addEventListener("click",()=>{showPanel(tournamentPanel);loadTournaments()});
document.getElementById("playersCard").addEventListener("click",()=>{showPanel(playersPanel);loadPlayers()});
document.getElementById("registrationCard").addEventListener("click",()=>{showPanel(registrationPanel);loadRegistrations()});
document.getElementById("createTournament").addEventListener("click",async()=>{const name=document.getElementById("tournamentName").value.trim(),game=document.getElementById("tournamentGame").value,date=document.getElementById("tournamentDate").value,entryFee=Number(document.getElementById("entryFee").value||0),prizePool=Number(document.getElementById("prizePool").value||0);if(!name){alert("Enter a tournament name.");return}const result=await supabaseClient.from("tournaments").insert({name,game,date:date||null,entry_fee:entryFee,prize_pool:prizePool,status:"OPEN"});if(result.error){alert("Error: "+result.error.message);return}alert("Tournament created successfully!");document.getElementById("tournamentName").value="";document.getElementById("tournamentDate").value="";document.getElementById("entryFee").value="";document.getElementById("prizePool").value="";loadTournaments()});
async function loadTournaments(){const c=document.getElementById("tournamentList");c.innerHTML="<p class='empty'>Loading tournaments...</p>";const r=await supabaseClient.from("tournaments").select("*").order("created_at",{ascending:false});if(r.error){c.innerHTML="<p class='empty'>"+escapeHTML(r.error.message)+"</p>";return}if(!r.data.length){c.innerHTML="<p class='empty'>No tournaments yet.</p>";return}c.innerHTML="";r.data.forEach(t=>{const item=document.createElement("div");item.className="item";item.innerHTML=`<h3>${escapeHTML(t.name)}</h3><p>Game: ${escapeHTML(t.game)}<br>Date: ${escapeHTML(t.date||"Not set")}<br>Entry Fee: ₹${escapeHTML(t.entry_fee)}<br>Prize Pool: ₹${escapeHTML(t.prize_pool)}<br>Status: ${escapeHTML(t.status)}</p><button class="delete" onclick="deleteTournament(${t.id})">DELETE</button>`;c.appendChild(item)})}
async function deleteTournament(id){if(!confirm("Delete this tournament?"))return;const r=await supabaseClient.from("tournaments").delete().eq("id",id);if(r.error){alert("Error: "+r.error.message);return}loadTournaments()}
async function loadPlayers(){const c=document.getElementById("playersList");c.innerHTML="<p class='empty'>Loading players...</p>";const r=await supabaseClient.from("players").select("*").order("created_at",{ascending:false});if(r.error){c.innerHTML="<p class='empty'>"+escapeHTML(r.error.message)+"</p>";return}if(!r.data.length){c.innerHTML="<p class='empty'>No players found.</p>";return}c.innerHTML="";r.data.forEach(p=>{const item=document.createElement("div");item.className="item";item.innerHTML=`<h3>${escapeHTML(p.username)}</h3><p>Email: ${escapeHTML(p.email||"N/A")}<br>Game: ${escapeHTML(p.game||"N/A")}</p>`;c.appendChild(item)})}
async function updateRegistrationStatus(id,status){if(!confirm(`Set this registration to ${status.toUpperCase()}?`))return;const r=await supabaseClient.from("registrations").update({status}).eq("id",id);if(r.error){alert("Could not update registration:\n"+r.error.message);return}await loadRegistrations()}
async function loadRegistrations(){const c=document.getElementById("registrationList");c.innerHTML="<p class='empty'>Loading registrations...</p>";const r=await supabaseClient.from("registrations").select(`id,tournament_id,team_id,status,registered_at,team_name,captain,captain_name,captain_uid,whatsapp,player2_name,player2_uid,player3_name,player3_uid,player4_name,player4_uid,referral_code,tournaments(name,game)`).order("registered_at",{ascending:false});if(r.error){c.innerHTML="<p class='empty'>"+escapeHTML(r.error.message)+"</p>";return}if(!r.data?.length){c.innerHTML="<p class='empty'>No registrations yet.</p>";return}c.innerHTML="";r.data.forEach(reg=>{const t=reg.tournaments;const status=(reg.status||"pending").toLowerCase();const item=document.createElement("div");item.className="item";item.innerHTML=`<h3>${escapeHTML(reg.team_name||"Unnamed Team")}</h3><p>Tournament: ${escapeHTML(t?.name||"Unknown")}<br>Game: ${escapeHTML(t?.game||"Unknown")}<br><br><b>Captain</b>: ${escapeHTML(reg.captain_name||reg.captain||"N/A")}<br>Captain UID: ${escapeHTML(reg.captain_uid||"N/A")}<br>WhatsApp: ${escapeHTML(reg.whatsapp||"N/A")}<br><br><b>Player 2</b>: ${escapeHTML(reg.player2_name||"N/A")} — UID: ${escapeHTML(reg.player2_uid||"N/A")}<br><b>Player 3</b>: ${escapeHTML(reg.player3_name||"N/A")} — UID: ${escapeHTML(reg.player3_uid||"N/A")}<br><b>Player 4</b>: ${escapeHTML(reg.player4_name||"N/A")} — UID: ${escapeHTML(reg.player4_uid||"N/A")}<br><br>Referral: ${escapeHTML(reg.referral_code||"None")}<br>Registered: ${formatIndiaTime(reg.registered_at)}</p><div class="status-badge status-${escapeHTML(status)}">STATUS: ${escapeHTML(status.toUpperCase())}</div>${status==="pending"?`<div class="item-actions"><button class="approve" onclick="updateRegistrationStatus(${reg.id},'approved')">✓ APPROVE</button><button class="reject" onclick="updateRegistrationStatus(${reg.id},'rejected')">✕ REJECT</button></div>`:status==="approved"?`<div class="item-actions"><button class="reject" onclick="updateRegistrationStatus(${reg.id},'rejected')">✕ REJECT</button></div>`:`<div class="item-actions"><button class="approve" onclick="updateRegistrationStatus(${reg.id},'approved')">✓ APPROVE</button></div>`}`;c.appendChild(item)})}
document.getElementById("logout").addEventListener("click",async()=>{await supabaseClient.auth.signOut();window.location.href="index.html"});
async function checkAdmin(){const result=await supabaseClient.auth.getSession();if(result.error||!result.data.session){window.location.href="index.html";return}const user=result.data.session.user;const admin=await supabaseClient.from("admins").select("id").eq("id",user.id).maybeSingle();if(admin.error||!admin.data){await supabaseClient.auth.signOut();window.location.href="index.html"}}
checkAdmin();
</script>
</body>
</html>
