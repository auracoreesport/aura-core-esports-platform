<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Core Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #08070d;
    color: white;
}

header {
    background: #0d0b14;
    border-bottom: 1px solid #292333;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #9b5cff;
}

.logout {
    background: #9b5cff;
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

main {
    padding: 50px 7%;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa4b5;
    margin-bottom: 40px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: #100d17;
    border: 1px solid #292333;
    border-radius: 15px;
    padding: 30px;
}

.card h2 {
    color: #9b5cff;
    margin-bottom: 10px;
}

.card p {
    color: #aaa4b5;
}

@media(max-width:800px) {
    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        AURA <span>CORE</span> ADMIN
    </div>

    <button class="logout" id="logoutButton">
        LOGOUT
    </button>
</header>

<main>

    <h1>Admin Dashboard 👑</h1>

    <p class="subtitle">
        Welcome, Aura Core Esports administrator.
    </p>

    <div class="cards">

        <div class="card">
            <h2>🏆 Tournaments</h2>
            <p>Manage Aura Core tournaments.</p>
        </div>

        <div class="card">
            <h2>👥 Players</h2>
            <p>Manage registered players and teams.</p>
        </div>

        <div class="card">
            <h2>📋 Registrations</h2>
            <p>View tournament registrations.</p>
        </div>

    </div>

</main>

<script>

const SUPABASE_URL =
    "https://lhwwplkxegkedlcgdxil.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aQlhnCTO4O1iRDqdoqWBzQ_-75xuvVc";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

async function checkAdmin() {

    const sessionResult =
        await supabaseClient.auth.getSession();

    if (
        sessionResult.error ||
        !sessionResult.data.session
    ) {
        window.location.href = "index.html";
        return;
    }

    const user =
        sessionResult.data.session.user;

    const adminResult =
        await supabaseClient
            .from("admins")
            .select("id")
            .eq("id", user.id)
            .maybeSingle();

    if (
        adminResult.error ||
        !adminResult.data
    ) {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
    }
}

document
    .getElementById("logoutButton")
    .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

    });

checkAdmin();

</script>

</body>
</html>
